name: LanguageCourses-Project

services:
    app:
        build:
            context: ../..
            dockerfile: .tools/docker/Dockerfile
        container_name: languagecourses_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ../../:/var/www/html
            - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
        ports:
            - "8001:80"
        networks:
            - languagecourses
        depends_on:
            - db
            - redis
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=languagecourses
            - DB_USERNAME=languagecourses
            - DB_PASSWORD=secret
            - REDIS_HOST=redis
            - REDIS_PORT=6379

    db:
        image: mysql:8.0
        container_name: languagecourses_db
        restart: unless-stopped
        ports:
            - "3308:3306"
        environment:
            MYSQL_DATABASE: languagecourses
            MYSQL_USER: languagecourses
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - languagecourses

    redis:
        image: redis:7-alpine
        container_name: languagecourses_redis
        restart: unless-stopped
        ports:
            - "6380:6379"
        networks:
            - languagecourses

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: languagecourses_phpmyadmin
        restart: unless-stopped
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: root
        networks:
            - languagecourses
        depends_on:
            - db

networks:
    languagecourses:
        driver: bridge

volumes:
    db_data:
        driver: local
